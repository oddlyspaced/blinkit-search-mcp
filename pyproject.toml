[project]
name = "blinkit-mcp"
version = "0.1.0"
description = "Read-only MCP server for browsing Blinkit products at a saved location"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9",
    "curl_cffi>=0.10",
    "Pillow>=11",
]

[project.scripts]
blinkit-mcp = "blinkit_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blinkit_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
